<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Agent 智能搜索测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box label {
            display: block;
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .search-box textarea {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .search-box textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .examples {
            margin-bottom: 20px;
        }

        .examples h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .example-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .example-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .result-section {
            margin-top: 30px;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .sql-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            overflow-x: auto;
        }

        .sql-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .explanation {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #0d47a1;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }

        .result-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }

        .result-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-table tr:hover {
            background: #f5f5f5;
        }

        .error-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 5px;
            color: #c62828;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-item {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-item .value {
            font-size: 1.8em;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 SQL Agent 智能搜索</h1>
            <p>输入自然语言问题，智能生成SQL并查询数据</p>
        </div>

        <div class="main-card">
            <div class="search-box">
                <label for="question">💬 请输入您的问题：</label>
                <textarea id="question" placeholder="例如：查询评分最高的5部电影"></textarea>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="askQuestion()">🚀 智能搜索</button>
                <button class="btn btn-secondary" onclick="clearResult()">🗑️ 清空结果</button>
            </div>

            <div class="examples">
                <h3>📝 示例问题（点击快速填入）：</h3>
                <div class="example-tags" id="exampleTags">
                    <div class="example-tag" onclick="fillQuestion('查询评分最高的5部电影')">查询评分最高的5部电影</div>
                    <div class="example-tag" onclick="fillQuestion('最新的10部电影')">最新的10部电影</div>
                    <div class="example-tag" onclick="fillQuestion('点击量最高的电影')">点击量最高的电影</div>
                    <div class="example-tag" onclick="fillQuestion('用户总数是多少')">用户总数是多少</div>
                    <div class="example-tag" onclick="fillQuestion('统计各类型电影数量')">统计各类型电影数量</div>
                    <div class="example-tag" onclick="fillQuestion('最新的20条评论')">最新的20条评论</div>
                    <div class="example-tag" onclick="fillQuestion('2023年的电影')">2023年的电影</div>
                    <div class="example-tag" onclick="fillQuestion('查询动漫类型的作品')">查询动漫类型的作品</div>
                </div>
            </div>

            <div id="resultSection" style="display: none;">
                <div class="result-section">
                    <h3>📊 查询结果</h3>
                    
                    <div id="stats" class="stats" style="display: none;">
                        <div class="stat-item">
                            <div class="label">结果数量</div>
                            <div class="value" id="resultCount">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">查询时间</div>
                            <div class="value" id="queryTime">0ms</div>
                        </div>
                    </div>

                    <div id="explanation" class="explanation" style="display: none;"></div>
                    
                    <div id="sqlBox" class="sql-box" style="display: none;">
                        <strong>生成的SQL语句：</strong>
                        <pre id="sqlContent"></pre>
                    </div>
                    
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let startTime = 0;

        function fillQuestion(question) {
            document.getElementById('question').value = question;
        }

        function clearResult() {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('question').value = '';
        }

        async function askQuestion() {
            const question = document.getElementById('question').value.trim();
            
            if (!question) {
                alert('请输入问题！');
                return;
            }

            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');
            
            resultSection.style.display = 'block';
            resultContent.innerHTML = '<div class="loading">正在智能分析问题并生成SQL</div>';
            
            startTime = Date.now();

            try {
                const response = await fetch(`${API_BASE}/sql-agent/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();
                const queryTime = Date.now() - startTime;

                if (data.success) {
                    displaySuccess(data, queryTime);
                } else {
                    displayError(data.error || '查询失败');
                }
            } catch (error) {
                displayError(`网络错误: ${error.message}<br><br>请确保后端服务已启动 (http://localhost:8000)`);
            }
        }

        function displaySuccess(data, queryTime) {
            // 显示统计信息
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('resultCount').textContent = data.result ? data.result.length : 0;
            document.getElementById('queryTime').textContent = queryTime + 'ms';

            // 显示说明
            if (data.explanation) {
                const explanationDiv = document.getElementById('explanation');
                explanationDiv.style.display = 'block';
                explanationDiv.innerHTML = `<strong>💡 查询说明：</strong> ${data.explanation}`;
            }

            // 显示SQL
            if (data.sql) {
                document.getElementById('sqlBox').style.display = 'block';
                document.getElementById('sqlContent').textContent = data.sql;
            }

            // 显示结果
            const resultContent = document.getElementById('resultContent');
            
            if (!data.result || data.result.length === 0) {
                resultContent.innerHTML = '<div style="text-align: center; padding: 20px; color: #999;">暂无数据</div>';
                return;
            }

            // 生成表格
            const table = document.createElement('table');
            table.className = 'result-table';

            // 表头
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            const keys = Object.keys(data.result[0]);
            
            keys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = key;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // 表体
            const tbody = document.createElement('tbody');
            data.result.forEach(row => {
                const tr = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = row[key] !== null ? row[key] : '-';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            resultContent.innerHTML = '';
            resultContent.appendChild(table);
        }

        function displayError(errorMsg) {
            document.getElementById('stats').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('sqlBox').style.display = 'none';
            
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `<div class="error-box"><strong>❌ 错误：</strong><br>${errorMsg}</div>`;
        }

        // 支持Enter键提交（Ctrl+Enter）
        document.getElementById('question').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                askQuestion();
            }
        });

        // 页面加载时的提示
        window.addEventListener('load', function() {
            console.log('SQL Agent 测试页面已加载');
            console.log('提示：可以按 Ctrl+Enter 快速提交问题');
        });
    </script>
</body>
</html>
